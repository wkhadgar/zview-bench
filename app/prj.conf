#
# Kconfig options that expose the target's runtime state to ZView (mirroring the
# prerequisites in the ZView README) plus the bench instrumentation.

# Thread discovery and stack analysis.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y

# Heap runtime statistics and fragmentation walking.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=4

# Portable cycle timing (DWT CYCCNT on Cortex-M). Share the source with thread
# runtime stats so the two do not contend for the cycle counter.
CONFIG_TIMING_FUNCTIONS=y
CONFIG_THREAD_RUNTIME_STATS_USE_TIMING_FUNCTIONS=y

# External instrumentation edge.
CONFIG_GPIO=y

# Hold the clock fixed: no power-management sleep states that would change
# the timing baseline the experiment measures.
CONFIG_PM=n
