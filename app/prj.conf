#
# Kconfig options that expose the target's runtime state to ZView. These mirror
# the prerequisites documented in the ZView README.

# Thread discovery and stack analysis.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_RUNTIME_STATS=y

# Heap runtime statistics and fragmentation walking.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=4
