# Shell cross-check build for the accuracy experiment (Q4). The kernel shell reports each
# thread's stack usage and share of execution cycles from the target itself, for comparison with
# what ZView reads at the same time. The shell adds a thread, its stack and the command code, so
# this build serves only as a cross-check. Build with -DEXTRA_CONF_FILE=shell.conf on the dynamic
# mode.
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=n
