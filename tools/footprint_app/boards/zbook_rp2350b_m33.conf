#
# The zbook's board defconfig puts a FAT filesystem on its SD card. FAT would
# need the fatfs module in the manifest, and the app uses no filesystem. This
# lowers the baseline only; the sweep's options are set by its own overlays.
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
