manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: wkhadgar
      url-base: https://github.com/wkhadgar

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: main
      import:
        # name-allowlist clones only the modules this app's boards need.
        name-allowlist:
          - cmsis_6   # ARM Cortex-M port
          - hal_stm32 # nucleo_h753zi (STM32H7)
          - hal_renesas # fpb_ra6e2 (RA6E2)

    # ZView itself, so `west zview ...` works from this workspace.
    - name: zview
      remote: wkhadgar
      revision: main
      path: modules/tools/zview
      west-commands: scripts/west-commands.yml
